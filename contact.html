<script>
  (function () {
   var button = document.getElementById('mobile-menu-button');
   var menu = document.getElementById('mobile-menu');

   if (!button || !menu) return;

   function setOpen(isOpen) {
    menu.classList.toggle('hidden', !isOpen);
    button.setAttribute('aria-expanded', String(isOpen));
   }

   button.addEventListener('click', function (e) {
    e.stopPropagation();
    var isOpen = !menu.classList.contains('hidden');
    setOpen(!isOpen);
   });

   document.addEventListener('click', function (e) {
    if (menu.classList.contains('hidden')) return;
    if (menu.contains(e.target) || button.contains(e.target)) return;
    setOpen(false);
   });

   document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') setOpen(false);
   });
  })();
</script>
<script>
 (function () {
  var logo = document.getElementById('brand-logo');
  var circle = document.getElementById('yellow-overlay-circle');

  if (!logo || !circle) return;

  function positionCircleAt(cx, cy) {
   var size = Math.ceil(Math.max(window.innerWidth, window.innerHeight) * 2.2);
   circle.style.width = size + 'px';
   circle.style.height = size + 'px';
   circle.style.left = (cx - size / 2) + 'px';
   circle.style.top = (cy - size / 2) + 'px';
  }

  function setYellow(isYellow) {
   document.body.classList.toggle('is-yellow', isYellow);
   circle.classList.toggle('scale-100', isYellow);
   try {
    if (!isYellow) window.localStorage.removeItem('yellowUntil');
   } catch (err) {}
  }

  function restorePersistedYellow() {
   var untilRaw = null;
   try {
    untilRaw = window.localStorage.getItem('yellowUntil');
   } catch (err) {}
   var until = untilRaw ? Number(untilRaw) : 0;
   if (!until || Number.isNaN(until)) return;
   var remaining = until - Date.now();
   if (remaining <= 0) {
    try { window.localStorage.removeItem('yellowUntil'); } catch (err) {}
    return;
   }

   // Keep the page yellow, but do NOT play/show the overlay circle on load.
   // This avoids a visible circle that appears to originate from the screen center.
   document.body.classList.add('transition-none');
   document.body.classList.add('is-yellow');
   circle.classList.add('transition-none');
   circle.classList.remove('scale-100');
   circle.classList.add('scale-0');
   window.requestAnimationFrame(function () {
    document.body.classList.remove('transition-none');
    circle.classList.remove('transition-none');
   });

   window.setTimeout(function () {
    setYellow(false);
   }, remaining);
  }

  try {
   restorePersistedYellow();
  } catch (err) {}

  function closeYellowFromElement(el) {
   try {
    window.localStorage.removeItem('yellowUntil');
   } catch (err) {}

   var anchor = document.getElementById('send-message-anchor');
   var target = anchor || el;
   if (target && target.getBoundingClientRect) {
    var rect = target.getBoundingClientRect();
    var cx = rect.left + rect.width / 2;
    var cy = rect.top + rect.height / 2;
    positionCircleAt(cx, cy);
   }

   // Start from a fully open circle at the target (button) position, then shrink.
   circle.classList.add('transition-none');
   circle.classList.add('scale-100');
   void circle.offsetWidth;
   circle.classList.remove('transition-none');

   // Turn the page background back to white, while the circle shrinks into the button.
   document.body.classList.remove('is-yellow');

   window.requestAnimationFrame(function () {
    window.requestAnimationFrame(function () {
     circle.classList.remove('scale-100');
    });
   });

   window.setTimeout(function () {
    setYellow(false);
   }, 720);
  }

  var sendButton = document.getElementById('send-message');
  if (sendButton) {
   sendButton.addEventListener('click', function (e) {
    if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    if (!document.body.classList.contains('is-yellow')) return;
    e.preventDefault();
    closeYellowFromElement(sendButton);
   });
  }

  // no logo click animation; animation is only triggered when navigating to contact
 })();
</script>
<script>
 (function () {
  var form = document.querySelector('form[name="contact"]');
  if (!form) return;

  var submitBtn = document.getElementById('send-message');
  var successEl = document.getElementById('form-success');
  var errorEl = document.getElementById('form-error');

  function setSubmitting(isSubmitting) {
   if (!submitBtn) return;
   submitBtn.disabled = isSubmitting;
   submitBtn.classList.toggle('opacity-60', isSubmitting);
   submitBtn.classList.toggle('pointer-events-none', isSubmitting);
  }

  function show(el) {
   if (!el) return;
   el.classList.remove('hidden');
  }

  function hide(el) {
   if (!el) return;
   el.classList.add('hidden');
  }

  form.addEventListener('submit', function (e) {
   if (successEl) hide(successEl);
   if (errorEl) hide(errorEl);

   if (!form.checkValidity || form.checkValidity()) {
    e.preventDefault();
    setSubmitting(true);

    var data = new FormData(form);
    var body = new URLSearchParams();
    data.forEach(function (value, key) {
     body.append(key, value);
    });

    fetch('/', {
     method: 'POST',
     headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
     body: body.toString()
    }).then(function (res) {
     if (res && res.ok) {
      form.reset();
      show(successEl);
     } else {
      show(errorEl);
     }
    }).catch(function () {
     show(errorEl);
    }).finally(function () {
     setSubmitting(false);
    });
   }
  });
 })();
</script>
